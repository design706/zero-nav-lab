    MUST MIRROR index.html:8-10. Two of the app's type families come from the
    Google Fonts CDN, not from public/fonts. Drop this and text metrics shift

    eliminate.
  -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Google+Sans+Flex:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" crossorigin href="/zero-nav-lab/assets/index-DsVFlwhA.css">
  <link rel="preload" as="image" href="/zero-nav-lab/zero-city-v4.webp" fetchpriority="high">

  <!-- Zero first-run flow: a variation layered on this build. Removes itself
       when the flow ends, leaving the nav lab exactly as it shipped. -->

  <link rel="stylesheet" href="/zero-nav-lab/firstrun/firstrun-shell.css">
  <script src="/zero-nav-lab/firstrun/roadmap-data.js"></script>

</head>
